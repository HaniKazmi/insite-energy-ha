name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          # The deps live in requirements_test.txt, which the default glob
          # (**/requirements.txt, **/pyproject.toml) doesn't match, and an
          # unmatched path fails the step rather than skipping the cache.
          cache-dependency-path: requirements_test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run tests
        run: pytest --cov=custom_components.insite_energy --cov-report=term-missing
