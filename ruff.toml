# Ruff's default rule set is broad and moves between releases, so an unpinned
# `ruff check` reports a different number run to run. Selecting explicitly is
# what makes the CI job mean something.
line-length = 90

[lint]
select = [
    "ASYNC", # blocking calls in async functions - the main hazard in an integration
    "B",     # bugbear
    "BLE",   # blind `except Exception` - deliberate in three places, see the noqa
    "C4",    # comprehensions
    "DTZ",   # naive datetimes, which this integration cannot afford
    "E",     # pycodestyle
    "F",     # pyflakes
    "I",     # import sorting
    "RUF",
    "SIM",
    "UP",    # pyupgrade
    "W",
]

[lint.isort]
# Home Assistant's own convention, which this code already follows: `import x`
# and `from x import y` sort together within a section, so `from datetime` comes
# before `import logging`.
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
split-on-trailing-comma = false

[lint.per-file-ignores]
# Tests reach into private helpers on purpose, and build naive datetimes to
# check they are rejected.
"tests/*" = ["DTZ"]
